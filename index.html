<!DOCTYPE html>
<html>
<head>
  <title>Smart Plant Monitoring</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>🌱 Smart Plant Monitoring System</h1>

  <!-- SENSOR CARDS -->
  <div class="card-container">

    <div class="card">
      <h2>Soil Moisture</h2>
      <p id="soil">--</p>
    </div>

    <div class="card">
      <h2>Temperature</h2>
      <p id="temp">--</p>
    </div>

    <div class="card">
      <h2>Humidity</h2>
      <p id="hum">--</p>
    </div>

  </div>

  <!-- HEALTH CARD -->
  <div class="health-card premium">
    <h2>🌿 Plant Health</h2>

    <div class="progress-circle">
      <span id="healthScore">0%</span>
    </div>

    <p id="healthStatus">Checking...</p>
  </div>

  <!-- PREDICTION -->
  <div class="prediction-box">
    <h3>📈 Future Prediction</h3>
    <p id="prediction">Loading...</p>
  </div>

  <!-- PUMP CONTROL -->
  <div class="pump-control">
    <h2>🚰 Pump Control</h2>

    <button id="pumpBtn" onclick="togglePump()">Turn ON</button>

    <p id="pumpStatus">Status: OFF ❌</p>
  </div>

  <!-- ALERT -->
  <div id="customAlert" class="alert-box"></div>

  <script src="script.js"></script>

</body>
</html>
